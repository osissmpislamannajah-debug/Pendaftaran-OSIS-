<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran OSIS SMP Islam Annajah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col items-center justify-center p-4">

  <!-- HALAMAN UTAMA (LANDING PAGE) -->
  <div id="landingPage" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 text-center space-y-6">
    <h1 class="text-2xl font-bold text-slate-800">Pendaftaran OSIS<br><span class="text-blue-600">SMP Islam Annajah</span></h1>
    <p class="text-gray-500 text-sm">Silakan pilih jalur akses Anda:</p>
    <div class="space-y-3">
      <button onclick="showPage('formPage')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Jalur Pendaftar</button>
      <button onclick="showPage('loginAdminPage')" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl transition">Jalur Admin</button>
    </div>
  </div>

  <!-- FORM PENDAFTARAN -->
  <div id="formPage" class="hidden w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 space-y-4 my-8">
    <div class="flex justify-between items-center border-b pb-3">
      <h2 class="text-xl font-bold text-slate-800">Formulir Pendaftaran OSIS</h2>
      <button onclick="showPage('landingPage')" class="text-sm text-gray-500 hover:underline">Kembali</button>
    </div>
    
    <form id="osisForm" onsubmit="submitForm(event)" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
          <input type="text" id="nama" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Kelas</label>
          <input type="text" id="kelas" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor Telepon / WhatsApp</label>
        <input type="tel" id="telepon" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Alasan Masuk OSIS</label>
        <textarea id="alasan" rows="2" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Kelebihan Diri</label>
          <textarea id="kelebihan" rows="2" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Kekurangan Diri</label>
          <textarea id="kekurangan" rows="2" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Harapan Jika Diterima Jadi Anggota OSIS</label>
        <textarea id="harapanDiri" rows="2" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Hal yang Ingin Dikembangkan Dalam Diri</label>
        <textarea id="pengembanganDiri" rows="2" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Harapan untuk OSIS Sekolah</label>
        <textarea id="harapanOsis" rows="2" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">Kirim Pendaftaran</button>
    </form>
  </div>

  <!-- LOGIN ADMIN -->
  <div id="loginAdminPage" class="hidden w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-4">
    <div class="flex justify-between items-center border-b pb-3">
      <h2 class="text-xl font-bold text-slate-800">Login Admin</h2>
      <button onclick="showPage('landingPage')" class="text-sm text-gray-500 hover:underline">Kembali</button>
    </div>
    <form onsubmit="loginAdmin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Username Admin</label>
        <input type="text" id="adminUser" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-slate-800 outline-none">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
        <input type="password" id="adminPass" required class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-slate-800 outline-none">
      </div>
      <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl transition">Masuk Dashboard</button>
    </form>
  </div>

  <!-- DASHBOARD ADMIN -->
  <div id="dashboardAdminPage" class="hidden w-full max-w-6xl bg-white rounded-2xl shadow-xl p-6 space-y-4 my-8">
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h2 class="text-xl font-bold text-slate-800">Dashboard Admin OSIS</h2>
        <p class="text-xs text-gray-500">Melihat & Mengelola Semua Jawaban Pendaftar</p>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="loadAdminData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg border">Refresh Data</button>
        <button onclick="showPage('landingPage')" class="text-sm text-red-600 hover:underline font-semibold">Logout</button>
      </div>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="bg-slate-100 text-slate-700">
            <th class="p-2 border">Waktu</th>
            <th class="p-2 border">Nama</th>
            <th class="p-2 border">Kelas</th>
            <th class="p-2 border">No. Telp</th>
            <th class="p-2 border">Alasan</th>
            <th class="p-2 border">Kelebihan / Kekurangan</th>
            <th class="p-2 border">Harapan Diri</th>
            <th class="p-2 border">Pengembangan Diri</th>
            <th class="p-2 border">Harapan OSIS</th>
            <th class="p-2 border text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <!-- Data pendaftar otomatis tampil di sini -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL Apps Script Terbaru Anda:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhrFasz2qqzeEkN6FBCPXaZtqvDDud9wiioaZXCoGOOhTM3z1Z_HR5TLnl4-gHcn4Z/exec";

    function showPage(pageId) {
      ['landingPage', 'formPage', 'loginAdminPage', 'dashboardAdminPage'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(pageId).classList.remove('hidden');
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Mengirim...";
      btn.disabled = true;

      const payload = {
        nama: document.getElementById('nama').value,
        kelas: document.getElementById('kelas').value,
        telepon: document.getElementById('telepon').value,
        alasan: document.getElementById('alasan').value,
        kelebihan: document.getElementById('kelebihan').value,
        kekurangan: document.getElementById('kekurangan').value,
        harapanDiri: document.getElementById('harapanDiri').value,
        pengembanganDiri: document.getElementById('pengembanganDiri').value,
        harapanOsis: document.getElementById('harapanOsis').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("Pendaftaran Berhasil Dikirim!");
        document.getElementById('osisForm').reset();
        showPage('landingPage');
      } catch (err) {
        alert("Gagal mengirim data. Silakan coba lagi.");
      } finally {
        btn.innerText = "Kirim Pendaftaran";
        btn.disabled = false;
      }
    }

    function loginAdmin(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;

      if (user === "OSISSMPISLAMANNAJAH" && pass === "OSISANNAJAH26/27OPENREQRUITMENT") {
        showPage('dashboardAdminPage');
        loadAdminData();
      } else {
        alert("Username atau Password Admin Salah!");
      }
    }

    async function loadAdminData() {
      const tbody = document.getElementById('adminTableBody');
      tbody.innerHTML = "<tr><td colspan='10' class='p-4 text-center'>Memuat data pendaftar...</td></tr>";

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        tbody.innerHTML = "";
        if (data.length <= 1) {
          tbody.innerHTML = "<tr><td colspan='10' class='p-4 text-center text-gray-500'>Belum ada pendaftar.</td></tr>";
          return;
        }

        // Menampilkan data dari yang paling baru
        for (let i = data.length - 1; i >= 1; i--) {
          const row = data[i];
          const tr = `
            <tr class="hover:bg-slate-50 border-b">
              <td class="p-2 font-mono text-[10px]">${new Date(row[0]).toLocaleString('id-ID')}</td>
              <td class="p-2 font-semibold">${row[1]}</td>
              <td class="p-2">${row[2]}</td>
              <td class="p-2">${row[3]}</td>
              <td class="p-2">${row[4]}</td>
              <td class="p-2"><b>+</b> ${row[5]}<br><b>-</b> ${row[6]}</td>
              <td class="p-2">${row[7]}</td>
              <td class="p-2">${row[8]}</td>
              <td class="p-2">${row[9]}</td>
              <td class="p-2 text-center">
                <button onclick="deleteData(${i}, '${row[1]}')" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-2 py-1 rounded text-[10px]">Hapus</button>
              </td>
            </tr>
          `;
          tbody.innerHTML += tr;
        }
      } catch (err) {
        tbody.innerHTML = "<tr><td colspan='10' class='p-4 text-center text-red-500'>Gagal memuat data. Silakan muat ulang.</td></tr>";
      }
    }

    async function deleteData(rowIndex, nama) {
      if (!confirm(`Apakah Anda yakin ingin menghapus data pendaftaran dari "${nama}"?`)) {
        return;
      }

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
        });

        alert(`Data ${nama} berhasil dihapus!`);
        loadAdminData();
      } catch (err) {
        alert("Gagal menghapus data.");
      }
    }
  </script>
</body>
</html>
